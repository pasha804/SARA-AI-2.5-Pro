<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SARA NEURAL COPILOT // V2.5 PRO</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      }
      .card {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: radial-gradient(120% 120% at 50% 10%, #0d1522 0%, #080d16 65%, #04070c 100%);
        border: 1.5px solid rgba(0, 240, 255, 0.4);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 240, 255, 0.25);
        position: relative;
        overflow: hidden;
        -webkit-app-region: drag;
      }

      /* Animated Kinetic Horology Geometry */
      .bg-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px dashed rgba(0, 240, 255, 0.18);
        pointer-events: none;
      }
      .bg-ring-1 { width: 380px; height: 380px; animation: spinCW 24s linear infinite; }
      .bg-ring-2 { width: 290px; height: 290px; border: 1px solid rgba(168, 85, 247, 0.15); animation: spinCCW 16s linear infinite; }

      /* Central Holographic Core & Orbital Rings */
      .avatar-center {
        position: relative;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
      }
      .orbital-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #00f0ff;
        border-right-color: rgba(168, 85, 247, 0.6);
        animation: spinCW 1.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        filter: drop-shadow(0 0 12px #00f0ff);
      }
      .orbital-ring-outer {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 1px dashed rgba(0, 240, 255, 0.45);
        animation: spinCCW 4s linear infinite;
      }
      .logo-img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        border-radius: 20px;
        filter: drop-shadow(0 0 22px rgba(0, 240, 255, 0.8));
        animation: breathPulse 2.8s ease-in-out infinite;
      }

      /* High-End Studio Typography */
      .brand-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.25em;
        color: #FFFFFF;
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
        text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
      }
      .brand-pill {
        font-size: 11px;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 20px;
        background: rgba(0, 240, 255, 0.15);
        color: #00f0ff;
        border: 1px solid rgba(0, 240, 255, 0.6);
        letter-spacing: 0.08em;
      }
      .brand-sub {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: #94a3b8;
        margin-top: 3px;
        font-weight: 600;
      }

      /* Progress Bar & Status */
      .progress-box {
        width: 300px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
        margin-top: 14px;
      }
      .progress-track {
        width: 100%;
        height: 4px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        position: relative;
      }
      .progress-fill {
        height: 100%;
        width: 45%;
        border-radius: 4px;
        background: linear-gradient(90deg, #00f0ff, #38bdf8, #a855f7);
        box-shadow: 0 0 16px #00f0ff;
        animation: progressAnim 2.2s ease-in-out infinite;
      }
      .status-text {
        font-size: 11px;
        color: #38bdf8;
        font-family: 'JetBrains Mono', monospace;
        letter-spacing: 0.06em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #00f0ff;
        box-shadow: 0 0 10px #00f0ff;
        animation: pulse 1s infinite;
      }

      @keyframes spinCW { to { transform: rotate(360deg); } }
      @keyframes spinCCW { to { transform: rotate(-360deg); } }
      @keyframes breathPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 18px rgba(0, 240, 255, 0.6)); }
        50% { transform: scale(1.04); filter: drop-shadow(0 0 28px rgba(168, 85, 247, 0.8)); }
      }
      @keyframes progressAnim {
        0% { transform: translateX(-100%); width: 35%; }
        50% { transform: translateX(50%); width: 70%; }
        100% { transform: translateX(250%); width: 35%; }
      }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bg-ring bg-ring-1"></div>
      <div class="bg-ring bg-ring-2"></div>

      <div class="avatar-center">
        <div class="orbital-ring-outer"></div>
        <div class="orbital-ring"></div>
        <img class="logo-img" src="../assets/sara_logo.png" alt="SARA" />
      </div>

      <div class="brand-title">
        <span>SARA</span>
        <span class="brand-pill">V2.5 PRO</span>
      </div>
      <div class="brand-sub">Neural Autonomous Companion // Pasha Dev</div>

      <div class="progress-box">
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
        <div class="status-text">
          <span class="status-dot"></span>
          <span id="splash-status">INITIALIZING NEURAL FABRIC...</span>
        </div>
      </div>
    </div>

    <script>
      const steps = [
        "INITIALIZING NEURAL FABRIC...",
        "SYNCHRONIZING PERSISTENT CONTEXT...",
        "CALIBRATING 60FPS COMPANION SHADERS...",
        "CONNECTING HIGH-SPEED GEMINI PROTOCOL...",
        "360+ N8N AUTOMATION PIPELINES READY...",
        "WELCOME BACK, PASHA JAN ✨"
      ];
      let i = 0;
      const el = document.getElementById('splash-status');
      setInterval(() => {
        i = (i + 1) % steps.length;
        if (el) el.textContent = steps[i];
      }, 700);
    </script>
  </body>
</html>
