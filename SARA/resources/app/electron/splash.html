<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SARA AI 3.0 ENTERPRISE PRO // INITIALIZING</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      .card {
        width: 100%;
        height: 100%;
        border-radius: 18px;
        background: #000000;
        border: 1.5px solid rgba(0, 240, 255, 0.6);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95), 0 0 45px rgba(0, 240, 255, 0.35);
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: drag;
        cursor: pointer;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 16px;
      }
      .skip-pill {
        position: absolute;
        bottom: 14px;
        right: 18px;
        font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
        font-size: 10px;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.6);
        background: rgba(0, 0, 0, 0.65);
        padding: 5px 12px;
        border-radius: 20px;
        border: 1px solid rgba(0, 240, 255, 0.3);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
        backdrop-filter: blur(8px);
      }
      .card:hover .skip-pill {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card" id="splash-card" title="Click or press any key to skip">
      <video id="intro-vid" src="intro_video.mp4" autoplay playsinline></video>
      <div class="skip-pill">PRESS ANY KEY OR CLICK TO SKIP ⇥</div>
    </div>

    <script>
      (function() {
        const vid = document.getElementById('intro-vid');
        const card = document.getElementById('splash-card');
        let finished = false;

        function finish() {
          if (finished) return;
          finished = true;
          try {
            const { ipcRenderer } = require('electron');
            ipcRenderer.send('splash-video-finished');
          } catch (e) {
            window.close();
          }
        }

        if (vid) {
          vid.play().catch(function() {
            // If autoplay with sound is blocked by OS policy, mute and retry
            vid.muted = true;
            vid.play().catch(function() {});
          });
          vid.addEventListener('ended', finish);
          vid.addEventListener('error', finish);
        }

        card.addEventListener('click', finish);
        window.addEventListener('keydown', finish);
      })();
    </script>
  </body>
</html>
