<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SARA AI 3.0 ENTERPRISE PRO // INITIALIZING</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      .card {
        width: 100%;
        height: 100%;
        border-radius: 18px;
        background: #000000;
        border: 1.5px solid rgba(0, 240, 255, 0.6);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95), 0 0 45px rgba(0, 240, 255, 0.35);
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card" id="splash-card">
      <video id="intro-vid" src="intro_video.mp4" autoplay playsinline></video>
    </div>

    <script>
      (function() {
        const vid = document.getElementById('intro-vid');
        let finished = false;

        function finish() {
          if (finished) return;
          finished = true;
          try {
            const { ipcRenderer } = require('electron');
            ipcRenderer.send('splash-video-finished');
          } catch (e) {
            window.close();
          }
        }

        if (vid) {
          vid.play().catch(function() {
            vid.muted = true;
            vid.play().catch(function() {});
          });
          vid.addEventListener('ended', finish);
          vid.addEventListener('error', finish);
        }

        // Allow skipping only on explicit Escape or Space
        window.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' || e.code === 'Space') {
            finish();
          }
        });
      })();
    </script>
  </body>
</html>
