<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SARA Autonomous Browser Test Suite — Portal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; margin-top: 0; }
        label { display: block; margin: 12px 0 4px; color: #94a3b8; font-weight: 500; }
        input[type="text"], input[type="email"], select, textarea {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #090d16; color: #f8fafc; box-sizing: border-box;
        }
        .btn { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 15px; }
        .btn:hover { background: #0369a1; }
        .cookie-banner { position: fixed; bottom: 0; left: 0; right: 0; background: #334155; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        #status-msg { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; }
        .success { background: #065f46; color: #6ee7b7; display: block !important; }
    </style>
</head>
<body>
    <div class="card">
        <h1>SARA Autonomous Test Form</h1>
        <form id="test-form" onsubmit="event.preventDefault(); document.getElementById('status-msg').className='success'; document.getElementById('status-msg').innerText='Form Successfully Submitted by SARA!';">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="fullName" placeholder="Enter full name" required>

            <label for="email-addr">Email Address</label>
            <input type="email" id="email-addr" name="email" placeholder="name@example.com" required>

            <label for="project-type">Project Type</label>
            <select id="project-type" name="projectType">
                <option value="desktop_ai">Desktop AI Agent</option>
                <option value="browser_bot" selected>Browser Autonomous Bot</option>
                <option value="discord_bot">Discord Community Bot</option>
            </select>

            <label for="task-desc">Task Instructions</label>
            <textarea id="task-desc" name="taskDesc" placeholder="Describe the autonomous task..." rows="3"></textarea>

            <label style="margin-top: 15px;">
                <input type="checkbox" id="agree-terms" name="agree"> I agree to autonomous execution guidelines
            </label>

            <button type="submit" id="submit-btn" class="btn" aria-label="Submit Mission Brief">Submit Mission Brief</button>
            <button type="button" id="alert-btn" class="btn" style="background: #475569; margin-left: 10px;" onclick="alert('System Alert Verified')">Trigger Alert</button>
        </form>

        <div id="status-msg"></div>
    </div>

    <div id="cookie-notice" class="cookie-banner">
        <span>We use essential cookies to maintain agent state.</span>
        <button id="accept-cookies" class="btn" style="margin: 0;" onclick="document.getElementById('cookie-notice').style.display='none';">Accept All Cookies</button>
    </div>
</body>
</html>
